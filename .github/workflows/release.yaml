name: Create Release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: data-migrations-package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'lacodix/laravel-data-migrations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Retain Lacodix's version/label conventions; this action only plans the release.
      - name: Plan version
        id: plan
        uses: rymndhng/release-on-push-action@aebba2bbce07a9474bf95e8710e5ee8a9e922fe2 # v0.28.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          bump_version_scheme: minor
          use_github_release_notes: true
          dry_run: true
      - name: Check inherited tags and publish exact validated commit
        if: steps.plan.outputs.tag_name != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLANNED_TAG: ${{ steps.plan.outputs.tag_name }}
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release({github, context, core, plannedTag: process.env.PLANNED_TAG});
