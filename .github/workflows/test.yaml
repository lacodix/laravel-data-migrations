name: Run Unit Tests

on:
  pull_request:
  push:
    branches: [master, "ci/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-stable, prefer-lowest]
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, xml, xmlwriter
          tools: composer:2.10.0
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Resolve dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          DEPENDENCY_VERSION: ${{ matrix.dependency-version }}
        run: |
          cp composer.json "$RUNNER_TEMP/data-migrations-composer.json"
          composer require "laravel/framework:$LARAVEL" --no-update --no-interaction
          composer require --dev "orchestra/testbench:$TESTBENCH" --no-update --no-interaction
          php .github/scripts/prepare-test-lane.php
          composer validate --strict
          composer update --prefer-stable --"$DEPENDENCY_VERSION" --prefer-dist --no-interaction
          composer show --direct
          composer check-platform-reqs
          composer audit
          cp "$RUNNER_TEMP/data-migrations-composer.json" composer.json
      - run: composer test

  quality:
    uses: ./.github/workflows/style.yaml

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'lacodix/laravel-data-migrations'
    needs: [tests, quality]
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yaml
